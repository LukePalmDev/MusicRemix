[project]
name = "ardour-studio-mcp"
version = "0.1.0"
description = "MCP extension for Ardour 9: Lua bridge (tempo, import, export, versioning) and audio QA"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "numpy>=2.0",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "scipy>=1.13",
]

[project.scripts]
ardour-studio-mcp = "ardour_studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ardour_studio_mcp"]
